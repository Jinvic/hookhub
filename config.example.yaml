server:
  addr: ":8080"
  log_level: info # debug | info | warn | error
  # max_body: 1m  # 入站 body 上限；空默认 1m；支持 512 / 512b / 512k / 1m / 2g（1024 进制）

sources:
  - name: vikunja
    driver: vikunja
    vars:
      base_url: "https://vikunja.example.com"
      timezone: "Asia/Shanghai" # 供模板 formatTime 使用
    config:
      auth_type: "hmac"
      secret_key: "${VIKUNJA_WEBHOOK_SECRET}"

  - name: ech0
    driver: ech0
    vars:
      base_url: "https://ech0.example.com"
    config:
      auth_type: "hmac"
      secret_key: "${ECH0_WEBHOOK_SECRET}"
      # max_skew: 300  # X-Ech0-Timestamp 允许偏差（秒）；hmac 默认 300；负值关闭

  # mox：账号侧 Incoming / Outgoing 各配一个 URL → 两个实例；Authorization 头值需与 mox 配置完全一致。
  # 大邮件可调大 server.max_body（mox Text/HTML 各自可至 1MB）。
  - name: mox-in
    driver: mox
    config:
      kind: incoming
      auth_type: authorization # authorization | none
      authorization: "${MOX_WEBHOOK_AUTH}"

  - name: mox-out
    driver: mox
    config:
      kind: outgoing
      auth_type: authorization
      authorization: "${MOX_WEBHOOK_AUTH}"

targets:
  - name: ntfy
    driver: ntfy
    config:
      url: "https://ntfy.sh"
      topic: "test"
      auth_type: "none"
      # auth_type: token
      # token: "${NTFY_TOKEN}"

  - name: gotify
    driver: gotify
    config:
      url: "https://gotify.example.com"
      token: "${GOTIFY_TOKEN}" # application token → X-Gotify-Key

  # 通用出站：URL 仅来自配置（防 SSRF）。json 体为固定字段 {title,message,priority,format,extra}，
  # 不是 Discord/Slack 专用 schema；对接特定 IM 若字段不合再加专用 Target 或后续 body 模板。
  - name: webhook-out
    driver: http
    config:
      url: "https://example.com/hooks/hookhub"
      auth_type: none # none | bearer | basic | header
      body_format: json # plain | json
      # token: "${HTTP_BEARER_TOKEN}"
      # header_name: X-Custom-Token

  # AstrBot IM：POST {url}/api/v1/im/messages；API Key 需 im scope
  # https://docs.astrbot.app/dev/openapi.html
  - name: astrbot
    driver: astrbot
    config:
      url: "https://astrbot.example.com"
      token: "${ASTRBOT_API_KEY}"
      umo: "webchat:FriendMessage:example"

# 下列 route 覆盖全部 source / target 实例各至少一次，可按需删减。
routes:
  # vikunja → ntfy（match.when：仅某项目；字段以真实 payload 为准）
  - name: vikunja-reminder-to-ntfy
    match:
      source: vikunja # Event.Source = 配置实例名
      type: "task.reminder.*" # Event.Type 分段通配
      when: 'data.project.id == 2' # 可选 CEL；空 = true；变量 source/type/subject/data/vars
    actions:
      - target: ntfy
        template:
          title: "{{ .Event.Subject }}"
          body: |
            任务：{{ .Event.Data.task.title }}
            项目：{{ .Event.Data.project.title }}
            提醒时间：{{ formatTime .Event.Data.reminder.reminder .Vars.timezone }}
          format: text
          priority: high
          extra:
            click: "{{ .Vars.base_url }}/tasks/{{ .Event.Data.task.id }}"

  # vikunja → astrbot
  - name: vikunja-reminder-to-astrbot
    match:
      source: vikunja
      type: "task.reminder.*"
    actions:
      - target: astrbot
        template:
          title: "{{ .Event.Subject }}"
          body: |
            任务：{{ .Event.Data.task.title }}
            项目：{{ .Event.Data.project.title }}
            提醒时间：{{ formatTime .Event.Data.reminder.reminder .Vars.timezone }}
            链接：{{ .Vars.base_url }}/tasks/{{ .Event.Data.task.id }}
          format: text

  # ech0 → gotify（排除某 nickname）
  - name: ech0-comment-to-gotify
    match:
      source: ech0
      type: "comment.created"
      when: 'data.payload_raw.Comment.nickname != "bot"'
    actions:
      - target: gotify
        template:
          title: 评论通知
          body: |
            `{{ .Event.Data.payload_raw.Comment.nickname }}` 进行了评论：
            > {{ .Event.Data.payload_raw.Comment.content }}
          format: markdown
          priority: high
          extra:
            click: "{{ .Vars.base_url }}/echo/{{ .Event.Data.payload_raw.Comment.echo_id }}"

  # ech0 → http（webhook-out）；action.when 可单独细控某一 target
  - name: ech0-comment-to-http
    match:
      source: ech0
      type: "comment.created"
    actions:
      - target: webhook-out
        # when: 'data.payload_raw.Comment.nickname != "bot"'
        template:
          title: 评论通知
          body: |
            {{ .Event.Data.payload_raw.Comment.nickname }}: {{ .Event.Data.payload_raw.Comment.content }}
            {{ .Vars.base_url }}/echo/{{ .Event.Data.payload_raw.Comment.echo_id }}
          format: text
          priority: default

  # mox 入站邮件 → ntfy
  - name: mox-incoming-to-ntfy
    match:
      source: mox-in
      type: incoming
    actions:
      - target: ntfy
        template:
          title: "新邮件通知: {{ .Event.Subject }}"
          body: |
            {{ with index .Event.Data.From 0 }}From: {{ .Address }}{{ end }}
            Mailbox: {{ .Event.Data.Meta.MailboxName }}
            {{ .Event.Data.Text }}
          format: text
          priority: default

  # mox 出站失败 → ntfy
  - name: mox-outgoing-failed-to-ntfy
    match:
      source: mox-out
      type: "outgoing.failed"
    actions:
      - target: ntfy
        template:
          title: "邮件投递失败: {{ .Event.Subject }}"
          body: |
            {{ .Event.Data.Error }}
            SMTP {{ .Event.Data.SMTPCode }} {{ .Event.Data.SMTPEnhancedCode }}
          format: text
          priority: high
