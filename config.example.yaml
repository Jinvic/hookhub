server:
  addr: ":8080"
  log_level: info # debug | info | warn | error

sources:
  - name: vikunja
    driver: vikunja
    vars:
      base_url: "https://vikunja.example.com"
      timezone: "Asia/Shanghai" # 供模板 formatTime 使用
    config:
      auth_type: "hmac"
      secret_key: "${VIKUNJA_WEBHOOK_SECRET}"

  - name: ech0
    driver: ech0
    vars:
      base_url: "https://ech0.example.com"
    config:
      auth_type: "hmac"
      secret_key: "${ECH0_WEBHOOK_SECRET}"
      # max_skew: 300  # X-Ech0-Timestamp 允许偏差（秒）；hmac 默认 300；负值关闭

targets:
  - name: ntfy
    driver: ntfy
    config:
      url: "https://ntfy.sh"
      topic: "test"
      auth_type: "none"
      # auth_type: token
      # token: "${NTFY_TOKEN}"

  - name: gotify
    driver: gotify
    config:
      url: "https://gotify.example.com"
      token: "${GOTIFY_TOKEN}" # application token → X-Gotify-Key

  # 通用出站：URL 仅来自配置（防 SSRF）。json 体为固定字段 {title,message,priority,format,extra}，
  # 不是 Discord/Slack 专用 schema；对接特定 IM 若字段不合再加专用 Target 或后续 body 模板。
  - name: webhook-out
    driver: http
    config:
      url: "https://example.com/hooks/hookhub"
      auth_type: none # none | bearer | basic | header
      body_format: json # plain | json
      # token: "${HTTP_BEARER_TOKEN}"
      # header_name: X-Custom-Token

  # AstrBot IM：POST {url}/api/v1/im/messages；API Key 需 im scope
  # https://docs.astrbot.app/dev/openapi.html
  - name: astrbot
    driver: astrbot
    config:
      url: "https://astrbot.example.com"
      token: "${ASTRBOT_API_KEY}"
      umo: "webchat:FriendMessage:example"

routes:
  - name: vikunja-reminder-to-ntfy
    match:
      source: vikunja # Event.Source = 配置实例名
      type: "task.reminder.*" # Event.Type 分段通配
    actions:
      - target: ntfy
        template:
          title: "{{ .Event.Subject }}"
          body: |
            任务：{{ .Event.Data.task.title }}
            项目：{{ .Event.Data.project.title }}
            提醒时间：{{ formatTime .Event.Data.reminder.reminder .Vars.timezone }}
          format: text
          priority: high
          extra:
            click: "{{ .Vars.base_url }}/tasks/{{ .Event.Data.task.id }}"

  - name: ech0-comment-to-ntfy
    match:
      source: ech0
      type: "comment.created"
    actions:
      - target: ntfy
        template:
          title: 评论通知
          body: |
            `{{ .Event.Data.payload_raw.Comment.nickname }}` 进行了评论：
            > {{ .Event.Data.payload_raw.Comment.content }}
          format: markdown
          priority: default
          extra:
            click: "{{ .Vars.base_url }}/echo/{{ .Event.Data.payload_raw.Comment.echo_id }}"

  - name: ech0-comment-to-gotify
    match:
      source: ech0
      type: "comment.created"
    actions:
      - target: gotify
        template:
          title: 评论通知
          body: |
            `{{ .Event.Data.payload_raw.Comment.nickname }}` 进行了评论：
            > {{ .Event.Data.payload_raw.Comment.content }}
          format: markdown
          priority: high
          extra:
            click: "{{ .Vars.base_url }}/echo/{{ .Event.Data.payload_raw.Comment.echo_id }}"
