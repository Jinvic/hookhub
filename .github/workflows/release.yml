name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Build binaries
        env:
          GOTOOLCHAIN: auto
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          for pair in "${targets[@]}"; do
            set -- $pair
            os=$1
            arch=$2
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/hookhub_${VERSION}_${os}_${arch}${ext}"
            echo "Building $out"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/hookhub
          done
          cd dist
          for f in hookhub_*; do
            if [[ "$f" == *.exe ]]; then
              zip "${f%.exe}.zip" "$f"
              rm "$f"
            else
              tar -czf "${f}.tar.gz" "$f"
              rm "$f"
            fi
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
